name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run build
      - name: Install pinned Chrome
        run: npx puppeteer browsers install chrome
      - name: Run tracking regression
        run: |
          npm run dev -- --host localhost --port 4173 > /tmp/vite.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 80); do
            if curl -fsS http://localhost:4173/ >/dev/null; then break; fi
            sleep 0.25
          done
          curl -fsS http://localhost:4173/ >/dev/null
          npm run test:track
